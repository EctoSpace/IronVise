name: CI

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
      full_matrix:
        description: "Also run the macOS and Windows jobs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Hosted runners have ~70 GB; the integration job's full test build with
  # incremental data and full debug info can exhaust it. Same settings as checks.yml.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ci-ubuntu"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev

      # Single Clippy pass with superset of features - compiles once
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --features enclave,enclave-remote,sandbox -- -D warnings

  security-audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ci-ubuntu"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: |
          # Audit the full graph without advisory exceptions.
          cargo audit

  test:
    name: Test - ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: "sandbox"
            shared-key: "ci-ubuntu"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.shared-key }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev

      - name: GLib backport optimized regression (Linux)
        run: cargo test --manifest-path third_party/glib/Cargo.toml --release --test ironvise_variant_iter

      # cargo test compiles implicitly - no separate build step needed
      - name: Run workspace tests
        run: cargo test --workspace --features ${{ matrix.features }}

  # Same steps as test; keep the two in step.
  test-desktop:
    name: Test - ${{ matrix.os }}
    if: ${{ inputs.full_matrix }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            features: "sandbox"
            shared-key: "ci-macos"
          - os: windows-latest
            features: "sandbox"
            shared-key: "ci-windows"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.shared-key }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev

      # cargo test compiles implicitly - no separate build step needed
      - name: Run workspace tests
        run: cargo test --workspace --features ${{ matrix.features }}

  enclave-unit:
    name: Enclave crypto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ci-ubuntu"

      - name: Enclave tests (IPC + remote attestation)
        run: |
          cargo test --features enclave -p ectoledger --lib -- enclave::ipc::tests
          cargo test --features enclave -p ectoledger --test enclave_ipc
          cargo test --features enclave-remote -p ectoledger --lib -- enclave::remote::tests

  enclave-apple-hv:
    name: Apple Hypervisor boot
    if: ${{ inputs.full_matrix }}
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,aarch64-unknown-none
          components: llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ci-macos-enclave"

      - name: Build enclave test binaries
        run: cargo test --features sandbox-apple-enclave --no-run 2>&1

      - name: Codesign test binary
        run: |
          BIN=""
          for candidate in target/debug/deps/enclave_apple_boot-*; do
            if [[ -f "$candidate" && -x "$candidate" && "$candidate" != *.* ]]; then
              BIN="$candidate"
              break
            fi
          done
          test -n "$BIN"
          echo "Signing: $BIN"
          codesign -s - --entitlements entitlements.xml --force "$BIN"

      - name: Run Apple HV tests (codesigned)
        run: |
          BIN=""
          for candidate in target/debug/deps/enclave_apple_boot-*; do
            if [[ -f "$candidate" && -x "$candidate" && "$candidate" != *.* ]]; then
              BIN="$candidate"
              break
            fi
          done
          test -n "$BIN"
          "$BIN" --nocapture

  gui:
    name: GUI build & check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Svelte check + Vite build
        run: |
          npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
          npm run test:dependencies
          npm run test:unit
          npx vite build

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ci-ubuntu"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev
        working-directory: ${{ github.workspace }}

      - name: Build IronVise binary
        run: cargo build -p ectoledger --features sandbox
        working-directory: ${{ github.workspace }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install SDK with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          ECTOLEDGER_BINARY: ${{ github.workspace }}/target/debug/ironvise

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck + test
        run: |
          npx tsc --noEmit
          npx vitest run
          npm run test:pack

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Preinstalled toolchains this job never uses: about 20 GB back.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ci-ubuntu"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev

      - name: Build host binary
        run: cargo build -p ectoledger --features sandbox

      - name: Run integration test script
        run: bash scripts/test-integration.sh
        timeout-minutes: 10

  tauri-bundle:
    name: Tauri bundle - ${{ matrix.os }}
    timeout-minutes: 40
    needs: [lint, test, gui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            shared-key: "ci-ubuntu"
            artifact-glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.shared-key }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Build Tauri desktop bundle
        working-directory: gui
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Tauri generation left tracked metadata clean
        run: git diff --exit-code -- gui/src-tauri/Cargo.toml gui/src-tauri/gen/schemas gui/src-tauri/icons

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ironvise-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 14

  # Same steps as tauri-bundle; keep the two in step.
  tauri-bundle-desktop:
    name: Tauri bundle - ${{ matrix.os }}
    if: ${{ inputs.full_matrix }}
    timeout-minutes: 40
    needs: [lint, test, test-desktop, gui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            shared-key: "ci-macos"
            artifact-glob: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
          - os: windows-latest
            platform: windows
            shared-key: "ci-windows"
            artifact-glob: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.shared-key }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install npm dependencies
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Build Tauri desktop bundle
        working-directory: gui
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify Tauri generation left tracked metadata clean
        run: git diff --exit-code -- gui/src-tauri/Cargo.toml gui/src-tauri/gen/schemas gui/src-tauri/icons

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ironvise-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 14
