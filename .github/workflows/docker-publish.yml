name: Docker Publish


# Manual only: the `v*` tag trigger has been removed, so tagging a release no
# longer publishes an image by itself. Publishing is now always a deliberate
# dispatch with publish_image checked.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: git tag or sha)"
        required: false
      publish_image:
        description: >-
          Push the image and create the multi-arch manifest in GHCR. Leave
          unchecked to build both architectures without publishing anything.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Serialise publishes: two tags pushed in quick succession would otherwise race
# to push the same manifest. Never cancel in progress - a half-published
# multi-arch manifest is worse than a queued one.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ectospace/ironvise

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # Automatic tag builds only on the public repo; manual dispatch works anywhere.
    if: github.repository == 'EctoSpace/IronVise' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    # A full Rust image build; cap it so a hung build cannot run to the 6-hour
    # default. Every other job in this repository carries a timeout.
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Only authenticate when something is actually going to be pushed.
      - name: Log in to GHCR
        if: inputs.publish_image
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Default source label is the checkout's git URL. Pin the public
          # repository so a dispatch from another checkout cannot publish it.
          labels: |
            org.opencontainers.image.source=https://github.com/EctoSpace/IronVise
            org.opencontainers.image.url=https://ectospace.com/IronVise

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        if: inputs.publish_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations record the source repository URL in the manifest.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Build only (rehearsal - nothing is pushed)
        if: ${{ !inputs.publish_image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        if: inputs.publish_image
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: inputs.publish_image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Rehearsal summary
        if: ${{ !inputs.publish_image }}
        run: |
          {
            echo "### Rehearsal only - nothing was pushed to GHCR"
            echo
            echo "Built \`${{ matrix.platform }}\` on \`${{ matrix.runner }}\` with"
            echo "\`outputs: type=cacheonly\`. No blobs, no digest, no manifest."
            echo "The manifest-merge job is skipped."
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: Merge multi-arch manifest
    # Repository guard, plus the publish gate: this job exists only to create a
    # real tagged manifest in GHCR, so in rehearsal mode there is nothing for it
    # to do and it is skipped entirely.
    if: >-
      (github.repository == 'EctoSpace/IronVise' || github.event_name == 'workflow_dispatch')
      && inputs.publish_image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,prefix=,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
            args+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
