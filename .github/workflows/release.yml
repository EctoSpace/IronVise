name: Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "New version release"
        required: false
      publish_release:
        description: >-
          Create a real GitHub release and tag. Leave unchecked to rehearse the
          build and the artifact round-trip without publishing anything.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"

permissions:
  contents: read

# Only one release may be in flight at a time; cancelling half-way would leave
# a partially-populated GitHub release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: python3 scripts/check-tauri-versions.py
      - name: Validate publishing tag
        if: inputs.publish_release
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          expected = f'refs/tags/v{version}'
          if os.environ['RELEASE_REF'] != expected:
              raise SystemExit(f'Publishing requires {expected}')
          PY

  build:
    needs: preflight
    name: Build - ${{ matrix.target }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux release binaries link against the build machine's glibc, so
          # they run only on systems at least that new. Build on the oldest
          # supported LTS (Ubuntu 22.04, glibc 2.35).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            features: "sandbox"
            timeout: 40

          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            features: "sandbox"
            timeout: 40

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            features: "sandbox"
            timeout: 75

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The runner image is part of the key: a target/ built on 24.04 holds
          # C objects (aws-lc-sys) compiled against glibc 2.38+ headers, and
          # restored onto 22.04 they fail to link (__isoc23_sscanf).
          shared-key: release-${{ matrix.os }}-${{ matrix.target }}

      # cargo test --release compiles + tests in one step
      - name: Build & test release binaries
        run: cargo test --locked --release -p ectoledger --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Build distributable binaries
        run: cargo build --locked --release -p ectoledger --bins --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Package binaries (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/ironvise staging/
          cp target/${{ matrix.target }}/release/guard-worker            staging/
          cp target/${{ matrix.target }}/release/verify-cert             staging/
          tar -czf ironvise-${{ matrix.target }}.tar.gz -C staging .

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\ironvise.exe" staging\
          Copy-Item "target\${{ matrix.target }}\release\guard-worker.exe"            staging\
          Copy-Item "target\${{ matrix.target }}\release\verify-cert.exe"             staging\
          Compress-Archive -Path staging\* -DestinationPath "ironvise-${{ matrix.target }}.zip"

      - name: Upload archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ironvise-${{ matrix.target }}
          path: ironvise-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 5

  gui-build:
    needs: preflight
    name: GUI - ${{ matrix.platform }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          # 22.04, not latest: see the build matrix above (glibc floor).
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      # Build and upload artifacts only; this job writes nothing to the repo.
      # It previously held `contents: write`, which it never used.
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gui/src-tauri
          # Per runner image, for the same reason as the build job above.
          shared-key: gui-${{ matrix.platform }}

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci --no-audit --no-fund

      - name: Build Tauri app
        working-directory: gui
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gui-artifacts
          shopt -s nullglob
          for f in target/release/bundle/appimage/*.AppImage \
                   target/release/bundle/deb/*.deb \
                   target/release/bundle/dmg/*.dmg \
                   target/release/bundle/msi/*.msi \
                   target/release/bundle/nsis/*.exe; do
            cp "$f" gui-artifacts/
          done
          if [ -z "$(ls -A gui-artifacts)" ]; then
            echo "::error::no installer was produced on ${{ matrix.platform }}."
            echo "Bundle tree was:"
            find target/release/bundle -maxdepth 2 2>/dev/null || echo "  (missing)"
            exit 1
          fi
          ls -lh gui-artifacts

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ironvise-gui-${{ matrix.platform }}
          path: gui-artifacts/
          if-no-files-found: error
          retention-days: 5

  release:
    name: Assemble release assets
    needs: [build, gui-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed only by the final step. Job permissions cannot be conditional,
      # so the `if:` on that step is what actually prevents a write.
      contents: write

    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true   # flatten all artifacts into artifacts/

      - name: List release assets
        run: ls -lh artifacts/

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          if find . -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "::error::release assets must be flat files; found directories:"
            find . -mindepth 1 -maxdepth 1 -type d
            exit 1
          fi
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort | xargs sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      # Fail loudly rather than skip silently. The action would otherwise tag
      # whatever ref it was dispatched from, so publishing from a branch is
      # almost certainly a mistake, not an intention worth honouring quietly.
      - name: Refuse to publish from a non-tag ref
        if: inputs.publish_release && !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error::publish_release=true requires a tag ref, but this run is on ${{ github.ref }}."
          echo "Dispatch from a tag to publish, or leave publish_release unchecked to rehearse."
          exit 1

      - name: Create GitHub Release and upload assets
        if: inputs.publish_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          # Explicit, rather than relying on the action's github.ref_name
          # default - the implicit behaviour is what made a branch dispatch
          # dangerous in the first place.
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rehearsal summary
        if: ${{ !inputs.publish_release }}
        run: |
          {
            echo "### Rehearsal only - nothing was published"
            echo
            echo "Built every target, round-tripped the artifacts through"
            echo "upload-artifact v7 / download-artifact v7, and generated checksums."
            echo "No GitHub release and no tag were created."
            echo
            echo "Assets that *would* have been published:"
            echo '```'
            ls -1 artifacts/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
