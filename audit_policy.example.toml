# Example audit policy. Use with: cargo run -- audit "Your goal" --policy audit_policy.toml
#
# NOTE: all keys are at the TOP LEVEL. The policy is parsed directly into the
# AuditPolicy struct (crates/core/src/policy.rs), so do NOT wrap these tables in
# a `[policy]` section - unknown top-level tables are silently ignored, which
# would make the policy a no-op that enforces nothing.

name = "web_server_audit_v1"
goal = "Audit nginx configuration for security misconfigurations"
max_steps = 30
require_findings = true
min_severity_threshold = "medium"

[[required_checks]]
name = "check_ssl_config"
action = "read_file"
params = { path = "/etc/nginx/nginx.conf" }
required = true
timeout_steps = 5

[[required_checks]]
name = "check_open_ports"
action = "run_command"
params = { command = "ss -tlnp" }
required = true

[[allowed_actions]]
action = "read_file"
path_pattern = "/etc/nginx/**"

[[allowed_actions]]
action = "run_command"
allowed_commands = ["ss", "ps", "netstat", "ls", "cat", "grep"]

[[forbidden_actions]]
action = "http_get"

[findings]
require_evidence_for_severity = ["high", "critical"]
evidence_must_reference_observation = true
