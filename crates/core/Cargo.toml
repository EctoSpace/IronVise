[package]
name = "ectoledger_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Shared pure logic for the IronVise: hashing, Merkle trees, schemas, and policy evaluation"
license.workspace = true

[dependencies]
sha2       = "0.11"
hex        = "0.4"
subtle     = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
bincode    = "1"
regex-lite = "0.1"
tracing    = "0.1"
toml       = "0.8"
url        = "2"
ipnetwork  = { workspace = true }
thiserror  = { workspace = true }

# --- Optional BLAKE3 (feature-gated) ---
blake3     = { version = "1", optional = true }

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }

[features]
default = []
# Use BLAKE3 instead of SHA-256 for content hashing.
hash-blake3 = ["dep:blake3"]

[[bench]]
name = "core"
harness = false
