# OWASP Top 10 Audit Policy Pack
# ===========================================================================
# Covers the OWASP Top 10 2025:
# A01 Broken Access Control, A02 Security Misconfiguration, A03 Software Supply Chain Failures,
# A04 Cryptographic Failures, A05 Injection, A06 Insecure Design,
# A07 Authentication Failures, A08 Software or Data Integrity Failures, A09 Security Logging and Alerting Failures,
# A10 Mishandling of Exceptional Conditions.
# ===========================================================================

name    = "OWASP Top 10 Security Audit"
goal    = "Audit the target application and infrastructure against the OWASP Top 10 2025: broken access control, security misconfiguration, software supply chain failures, cryptographic failures, injection flaws, and authentication failures."
max_steps = 45

forbidden_actions = ["write_file", "delete_file"]

# Controls the audit is expected to cover. Kept with the policy; the engine
# does not enforce them in 0.8.
required_checks = [
    "A01: Access control configuration reviewed (permissions, RBAC)",
    "A02: Security headers and default configuration hardening verified",
    "A03: Dependency inventory and known CVE status reviewed",
    "A04: Cryptographic configuration reviewed (TLS version, cipher suites, hashing)",
    "A05: Input validation and injection surface identified",
    "A06: Insecure design mitigations checked",
    "A07: Authentication mechanism and session management reviewed",
    "A09: Application logging completeness verified",
    "A10: Exceptional conditions and error handling checked"
]

# ===========================================================================
# Command rules
# ===========================================================================

# Actions the agent may take. run_command is limited to these programs; the
# Windows equivalents (dir, type, findstr, ...) follow the Unix names, and a
# name the host does not allow (see executor.rs) never runs there.
# (allow general inspection and common security scanners).
[[allowed_actions]]
action = "run_command"
allowed_commands = ["ls", "cat", "find", "grep", "curl", "openssl", "nmap", "nikto", "git", "pip", "npm", "yarn", "composer", "mvn", "gradle", "trivy", "snyk", "semgrep", "bandit", "gosec", "dir", "type", "findstr", "where", "certutil"]

[[allowed_actions]]
action = "read_file"

[[allowed_actions]]
action = "http_get"

[[allowed_actions]]
action = "complete"

[[command_rules]]
program = "metasploit"
arg_pattern = ".*"
decision = "deny"
reason = "Block active exploitation frameworks"

[[command_rules]]
program = "msfconsole"
arg_pattern = ".*"
decision = "deny"
reason = "Block active exploitation frameworks"

[[command_rules]]
program = "sqlmap"
arg_pattern = "^--dbs"
decision = "deny"
reason = "Block active exploitation frameworks"

[[command_rules]]
program = "hydra"
arg_pattern = ".*"
decision = "deny"
reason = "Block active exploitation frameworks"

[[command_rules]]
program = "john"
arg_pattern = "^--crack"
decision = "deny"
reason = "Block active exploitation frameworks"

[[command_rules]]
program = "rm"
arg_pattern = "^-rf"
decision = "deny"
reason = "Block destructive operations"

[[command_rules]]
program = "dd"
arg_pattern = ".*"
decision = "deny"
reason = "Block destructive operations"

[[command_rules]]
program = "shred"
arg_pattern = ".*"
decision = "deny"
reason = "Block destructive operations"

# ===========================================================================
# Observation rules: A04 Cryptographic Failures & A07 Auth Failures
# ===========================================================================

# Redact API keys and tokens in output
[[observation_rules]]
pattern = "(?i)(api[_-]?key|access[_-]?token|bearer|secret)\\s*[=:]\\s*[A-Za-z0-9_\\-\\.]{16,}"
action = "redact"
label = "api_keys_tokens"

# Redact passwords in config or env output
[[observation_rules]]
pattern = "(?i)password\\s*[=:]\\s*\\S+"
action = "redact"
label = "passwords_env"

# Redact private key PEM blocks
[[observation_rules]]
pattern = "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
action = "redact"
label = "private_key_pem"

# Flag weak hashing algorithms (A04)
[[observation_rules]]
pattern = "(?i)\\b(md5|sha1|des|rc4)\\b"
action = "flag"
label = "weak_hashing_algorithms"

# Flag missing security headers in HTTP responses (A02)
[[observation_rules]]
pattern = "(?i)(X-Frame-Options|Content-Security-Policy|Strict-Transport-Security).*missing"
action = "flag"
label = "security_headers_http"

# Flag known vulnerable dependency CVE mentions (A03)
[[observation_rules]]
pattern = "CVE-[0-9]{4}-[0-9]{4,}"
action = "flag"
label = "known_vulnerable_dependency"

# ===========================================================================
# Approval gates: SSRF & key reading
# ===========================================================================

[[approval_gates]]
description     = "HTTP calls to internal CIDR 10.x require approval (SSRF Prevention)"
trigger         = "action == 'http_get' && url_host_in_cidr('10.0.0.0/8')"
require_approval = true
timeout_seconds = 60
on_timeout      = "deny"

[[approval_gates]]
description     = "HTTP calls to internal CIDR 172.16.x require approval (SSRF Prevention)"
trigger         = "action == 'http_get' && url_host_in_cidr('172.16.0.0/12')"
require_approval = true
timeout_seconds = 60
on_timeout      = "deny"

[[approval_gates]]
description     = "Reading certificate/key files requires approval (A04)"
trigger         = "action == 'read_file' && path_extension_matches('(\\.pem|\\.key|\\.crt|\\.p12)')"
require_approval = true
timeout_seconds = 120
on_timeout      = "deny"

[[approval_gates]]
description     = "Nikto or SQLMap invocation requires approval (A05)"
trigger         = "action == 'run_command' && command_matches_regex('nikto|sqlmap')"
require_approval = true
timeout_seconds = 300
on_timeout      = "deny"