# PCI-DSS Audit Policy Pack
# ---------------------------------------------------------------------------
# Covers PCI-DSS v4.0.1 requirements most relevant to automated audits:
# Req 1 (network controls), Req 2 (secure configs), Req 3 (cardholder data),
# Req 6 (secure systems), Req 8 (auth), Req 10 (logging), Req 11 (testing),
# and Req 12 (TPSP and risk management).
# ---------------------------------------------------------------------------

name    = "PCI-DSS Compliance Audit"
goal    = "Audit the cardholder data environment for PCI-DSS v4.0.1 compliance: network segmentation, access controls, encryption, logging, script integrity, and vulnerability management."
max_steps = 50

forbidden_actions = ["write_file", "delete_file"]

# Controls the audit is expected to cover. Kept with the policy; the engine
# does not enforce them in 0.8.
required_checks = [
    "Firewall rules restrict inbound CDE access to necessary ports only",
    "No default vendor passwords present in critical services",
    "TLS 1.2 or higher enforced for cardholder data in transit",
    "Sensitive authentication data not stored post-authorization and PANs use keyed hashes",
    "Payment page script integrity controls and TPSP agreements reviewed",
    "System and application activity logs present",
    "Vulnerability scan results reviewed",
]

# ---------------------------------------------------------------------------
# Command rules
# ---------------------------------------------------------------------------

# Actions the agent may take. run_command is limited to these programs; the
# Windows equivalents (dir, type, findstr, ...) follow the Unix names, and a
# name the host does not allow (see executor.rs) never runs there.
# (allow standard system inspection).
[[allowed_actions]]
action = "run_command"
allowed_commands = ["ls", "cat", "stat", "find", "grep", "awk", "head", "tail", "id", "whoami", "uname", "ps", "ss", "netstat", "ip", "openssl", "nmap", "nikto", "curl", "systemctl", "journalctl", "iptables", "ufw", "firewall-cmd", "dir", "type", "findstr", "where", "hostname", "tasklist", "systeminfo", "icacls", "attrib", "ver"]

[[allowed_actions]]
action = "read_file"

[[allowed_actions]]
action = "http_get"

[[allowed_actions]]
action = "complete"

[[command_rules]]
program = "metasploit"
arg_pattern = ".*"
decision = "deny"
reason = "Block live exploitation tools"

[[command_rules]]
program = "msfconsole"
arg_pattern = ".*"
decision = "deny"
reason = "Block live exploitation tools"

[[command_rules]]
program = "sqlmap"
arg_pattern = ".*"
decision = "deny"
reason = "Block live exploitation tools"

[[command_rules]]
program = "hydra"
arg_pattern = ".*"
decision = "deny"
reason = "Block live exploitation tools"

[[command_rules]]
program = "medusa"
arg_pattern = ".*"
decision = "deny"
reason = "Block live exploitation tools"

[[command_rules]]
program = "john"
arg_pattern = ".*"
decision = "deny"
reason = "Block live exploitation tools"

[[command_rules]]
program = "hashcat"
arg_pattern = ".*"
decision = "deny"
reason = "Block live exploitation tools"

[[command_rules]]
program = "rm"
arg_pattern = "^-rf"
decision = "deny"
