[[command_rules]]
program = "shred"
arg_pattern = ".*"
decision = "deny"
reason = "Block destructive operations"

# ---------------------------------------------------------------------------
# Observation rules
# ---------------------------------------------------------------------------

# Redact PANs - primary account numbers (credit card numbers)
[[observation_rules]]
pattern = "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\\b"
action = "redact"
label = "pans_primary_account"

# Redact private key material
[[observation_rules]]
pattern = "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
action = "redact"
label = "private_key_material"

# Flag weak TLS or SSL versions in output
[[observation_rules]]
pattern = "(?i)(SSLv2|SSLv3|TLSv1\\.0|TLSv1\\.1)"
action = "flag"
label = "weak_tls_ssl"

# Redact passwords in configuration output
[[observation_rules]]
pattern = "(?i)password\\s*[=:]\\s*\\S+"
action = "redact"
label = "passwords_configuration"

# ---------------------------------------------------------------------------
# Approval gates
# ---------------------------------------------------------------------------

[[approval_gates]]
description     = "Reading private keys or certificates requires approval"
trigger         = "action == 'read_file' && path_extension_matches('(\\.pem|\\.key|\\.crt|\\.p12|\\.pfx)')"
require_approval = true
timeout_seconds = 180
on_timeout      = "deny"

[[approval_gates]]
description     = "Network segmentation scans require approval (Req 11)"
trigger         = "action == 'run_command' && command_matches_regex('nmap|masscan|nikto')"
require_approval = true
timeout_seconds = 300
on_timeout      = "deny"

[[approval_gates]]
description     = "HTTP calls into RFC-1918 space require approval"
trigger         = "action == 'http_get' && url_host_in_cidr('192.168.0.0/16')"
require_approval = true
timeout_seconds = 60
on_timeout      = "deny"

[[approval_gates]]
description     = "HTTP calls into 10.x space require approval"
trigger         = "action == 'http_get' && url_host_in_cidr('10.0.0.0/8')"
require_approval = true
timeout_seconds = 60
on_timeout      = "deny"