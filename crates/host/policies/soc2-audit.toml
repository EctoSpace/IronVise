# SOC 2 Audit Policy Pack
# ---------------------------------------------------------------------------
# Covers the core SOC 2 Trust Services Criteria most relevant to automated
# audits: Security (CC6), Availability (A1), Confidentiality (C1), 
# and ongoing Vendor Risk Management.
# ---------------------------------------------------------------------------

name    = "SOC2 Compliance Audit"
goal    = "Audit system controls for SOC2 Trust Services Criteria: access management, logging completeness, encryption at rest, change management, and continuous risk monitoring."
max_steps = 40

# Actions that are never permitted under this policy
forbidden_actions = ["write_file", "delete_file"]

# Controls the audit is expected to cover. Kept with the policy; the engine
# does not enforce them in 0.8.
required_checks = [
    "SSH access controls reviewed",
    "Sudo/privilege escalation rules reviewed",
    "Authentication log files present and readable",
    "Encryption-at-rest configuration verified",
    "Audit log rotation policy confirmed",
    "Vendor management and supply-chain risk controls verified",
    "Continuous security monitoring and risk assessment verified",
]

# ---------------------------------------------------------------------------
# Command rules - restrict dangerous enumeration tools
# ---------------------------------------------------------------------------

# Actions the agent may take. run_command is limited to these programs; the
# Windows equivalents (dir, type, findstr, ...) follow the Unix names, and a
# name the host does not allow (see executor.rs) never runs there.
# (allow standard unix inspection commands).
[[allowed_actions]]
action = "run_command"
allowed_commands = ["ls", "cat", "stat", "find", "grep", "awk", "sed", "head", "tail", "wc", "df", "du", "id", "whoami", "uname", "hostname", "ps", "netstat", "ss", "ip", "ifconfig", "openssl", "systemctl", "journalctl", "auditctl", "auditd", "dir", "type", "findstr", "where", "tasklist", "systeminfo", "icacls", "attrib", "ver"]

[[allowed_actions]]
action = "read_file"

[[allowed_actions]]
action = "http_get"

[[allowed_actions]]
action = "complete"

[[command_rules]]
program = "nmap"
arg_pattern = ".*"
decision = "deny"
reason = "Block active network scanning"

[[command_rules]]
program = "masscan"
arg_pattern = ".*"
decision = "deny"
reason = "Block active network scanning"

[[command_rules]]
program = "zmap"
arg_pattern = ".*"
decision = "deny"
reason = "Block active network scanning"

[[command_rules]]
program = "unicornscan"
arg_pattern = ".*"
decision = "deny"
reason = "Block active network scanning"

[[command_rules]]
program = "hping"
arg_pattern = ".*"
decision = "deny"
reason = "Block active network scanning"

[[command_rules]]
program = "tcpdump"
arg_pattern = ".*"
decision = "deny"
reason = "Block packet capture"

[[command_rules]]
program = "wireshark"
arg_pattern = ".*"
decision = "deny"
reason = "Block packet capture"

[[command_rules]]
program = "tshark"
arg_pattern = ".*"
decision = "deny"
reason = "Block packet capture"

[[command_rules]]
program = "rm"
arg_pattern = "^-rf"
decision = "deny"
reason = "Block destructive operations"

[[command_rules]]
program = "dd"
arg_pattern = ".*"
decision = "deny"
reason = "Block destructive operations"

[[command_rules]]
program = "shred"
arg_pattern = ".*"
decision = "deny"
reason = "Block destructive operations"

[[command_rules]]
program = "mkfs"
arg_pattern = ".*"
decision = "deny"
reason = "Block destructive operations"

# ---------------------------------------------------------------------------
# Observation rules - redact secrets that surface in command output
# ---------------------------------------------------------------------------

# Redact private key material
[[observation_rules]]
pattern = "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
action = "redact"
label = "private_key_material"

# Redact AWS secret keys
[[observation_rules]]
pattern = "(?i)aws_secret_access_key\\s*=\\s*[A-Za-z0-9/+]{40}"
action = "redact"
label = "aws_secret_keys"

# Redact generic passwords in config output
[[observation_rules]]
pattern = "(?i)password\\s*[=:]\\s*\\S+"
action = "redact"
label = "generic_passwords"

# Flag any base64-encoded blobs larger than 100 chars (possible exfil)
[[observation_rules]]
pattern = "[A-Za-z0-9+/]{100,}={0,2}"
action = "flag"
label = "base64_encoded_blobs"

# ---------------------------------------------------------------------------
# Approval gates - require human sign-off for high-impact actions
# ---------------------------------------------------------------------------

[[approval_gates]]
description     = "Network scan tools require explicit approval"
trigger         = "action == 'run_command' && command_matches_regex('nmap|masscan|zmap')"
require_approval = true
timeout_seconds = 120
on_timeout      = "deny"

[[approval_gates]]
description     = "Reading private keys or certificates requires approval"
trigger         = "action == 'read_file' && path_extension_matches('(\\.pem|\\.key|\\.crt|\\.p12|\\.pfx)')"
require_approval = true
timeout_seconds = 180
on_timeout      = "deny"

[[approval_gates]]
description     = "HTTP calls to internal CIDR ranges require approval"
trigger         = "action == 'http_get' && url_host_in_cidr('10.0.0.0/8')"
require_approval = true
timeout_seconds = 60
on_timeout      = "deny"