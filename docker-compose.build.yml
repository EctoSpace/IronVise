# Build override - compile IronVise from source instead of pulling from GHCR.
#
# Usage:
#   docker compose -f docker-compose.demo.yml -f docker-compose.build.yml up --build
#
# First build takes ~5-10 min (Rust compile). Subsequent builds use Docker layer cache.

services:
  ironvise:
    image: ironvise:local
    build:
      context: .
      dockerfile: Dockerfile
      # BuildKit otherwise records the source repository URL in the manifest.
      provenance: false
      sbom: false
