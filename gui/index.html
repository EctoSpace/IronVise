<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sets data-theme on <html> from the persisted Appearance preference
         before anything below paints. A classic <script src>, not inline:
         the Tauri CSP is `script-src 'self'` with no `'unsafe-inline'`. See
         public/theme-boot.js and src/lib/stores/theme.ts. -->
    <script src="/theme-boot.js"></script>
    <title>IronVise GUI</title>
    <!-- Critical CSS: background matches the resolved theme so the window is
         never the wrong colour while the rest of app.css loads. -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: system-ui, sans-serif; }
      html[data-theme="light"], html[data-theme="light"] body { background: #eef1f5; color: #12161c; }
      #app { width: 100%; height: 100%; min-height: 100vh; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
