[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ironvise"
version = "0.8.0"
description = "AI firewall and hash-chained, signed audit trail for AI agents. Python SDK for IronVise."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Björn Roman Kohlberger", email = "ironvise@ectospace.com" }]
keywords = ["ai", "audit", "ledger", "compliance", "langchain", "autogen"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
]

[project.optional-dependencies]
langchain = [
  "langchain-core>=0.3",
]
autogen = [
  "autogen-agentchat>=0.4",
]
# Framework integrations are optional to install and tested against the real
# upstream libraries in the dev environment.
dev = [
  "pytest>=9",
  "pytest-asyncio>=0.21",
  "pytest-timeout>=2.3",
  "respx>=0.22",
  "langchain-core>=0.3",
  "autogen-agentchat>=0.4",
  "autogen-ext>=0.4",
]

[project.urls]
Homepage      = "https://ectospace.com/IronVise"
GitHub        = "https://github.com/EctoSpace/IronVise"
Issues        = "https://github.com/EctoSpace/IronVise/issues"
Documentation = "https://github.com/EctoSpace/IronVise/tree/main/sdk/python"

[tool.pytest.ini_options]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 15
filterwarnings = [
    "ignore:The test .* is marked with '@pytest.mark.asyncio' but it is not an async function:pytest.PytestWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["ironvise_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/ironvise_sdk", "/pyproject.toml", "/README.md", "/LICENSE"]
