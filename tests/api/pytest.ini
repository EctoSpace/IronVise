# tests/api is its own pytest root (run: python3 -m pytest tests/api -q).
# Its async tests need asyncio_mode = auto, which used to live only in
# sdk/python/pyproject.toml, so 128 of them failed when run as documented.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    timeout: per-test time limit (honoured when pytest-timeout is installed)
