# Vendored copy of pg-embed 1.0.0 (crates.io). See VENDORED.md: the only
# change from upstream is zip 8 -> 9 (RUSTSEC-2026-0367/0368/0369).
[package]
edition = "2024"
rust-version = "1.88"
name = "pg-embed"
version = "1.0.0"
authors = ["Franz-Aliu Okunega"]
description = "Run a Postgresql database locally on Linux, MacOS or Windows as part of another Rust application or test."
documentation = "https://docs.rs/pg-embed"
readme = "README.md"
license = "MIT/Apache-2.0"
repository = "https://github.com/faokunega/pg-embed"
publish = false

[features]
default = ["rt_tokio_migrate"]
rt_tokio = ["tokio", "reqwest"]
rt_tokio_migrate = ["tokio", "reqwest", "sqlx"]

[lib]
name = "pg_embed"
path = "src/lib.rs"

[dependencies]
dirs = "6.0"
log = "0.4"
lzma-rs = "0.3"
reqwest = { version = "0.13", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate"], optional = true }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"], optional = true }
# Upstream: zip = "8" with default features. Only ZipArchive reading of the
# deflate-compressed zonky JAR is used, so deflate alone is enough.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
